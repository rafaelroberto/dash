<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Automático - Google Sheets</title>
  
  <!-- Biblioteca para ler o CSV da Planilha -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
  <!-- Biblioteca para Gráficos -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background-color: #f0f2f5;
      margin: 0;
      padding: 20px;
      color: #333;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
      background: white;
      padding: 15px 25px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    .header h1 { margin: 0; font-size: 1.6rem; color: #1a202c; }
    .status {
      font-size: 0.85rem;
      background: #e2e8f0;
      padding: 6px 12px;
      border-radius: 20px;
      color: #4a5568;
    }

    /* Grid de Cards de Indicadores (KPIs) */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 15px;
      margin-bottom: 25px;
    }
    .kpi-card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      border-left: 5px solid #3182ce;
    }
    .kpi-card span { font-size: 0.8rem; color: #718096; text-transform: uppercase; font-weight: bold; }
    .kpi-card h2 { margin: 10px 0 0 0; font-size: 1.5rem; color: #2d3748; }

    /* Estilo das Seções principais */
    .dashboard-section {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      margin-bottom: 25px;
    }
    .dashboard-section h3 { margin-top: 0; color: #2d3748; border-bottom: 2px solid #edf2f7; padding-bottom: 10px; }

    /* Tabela de Dados */
    .table-container { overflow-x: auto; max-height: 400px; }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }
    th, td {
      padding: 12px 15px;
      text-align: left;
      border-bottom: 1px solid #edf2f7;
    }
    th { background-color: #f7fafc; color: #4a5568; font-weight: 600; sticky: top; }
    tr:hover { background-color: #f8fafc; }

    .chart-container { position: relative; height: 380px; }
  </style>
</head>
<body>

  <div class="header">
    <h1>Dashboard da Planilha</h1>
    <div class="status" id="lastUpdate">Carregando dados...</div>
  </div>

  <!-- Cards com Totais e Médias automáticas -->
  <div class="kpi-grid" id="kpiContainer"></div>

  <!-- Gráfico Automático -->
  <div class="dashboard-section">
    <h3>Visão Geral (Gráfico Automático)</h3>
    <div class="chart-container">
      <canvas id="autoChart"></canvas>
    </div>
  </div>

  <!-- Tabela com Todas as Células -->
  <div class="dashboard-section">
    <h3>Dados Atualizados da Planilha</h3>
    <div class="table-container">
      <table id="dataTable">
        <thead><tr id="tableHeader"></tr></thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
  </div>

  <script>
    // Link convertido da sua planilha do Google Sheets para formato CSV
    const URL_PLANILHA_CSV = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTQ6Va9-UFwz5EQS9s0d_rhmIY83BARQluba4GyTiwWnV78FhrpaVEEPLO_8HkX0o19IGt7laSp-Bba/pub?gid=264969244&single=true&output=csv";

    let chartInstance = null;

    function carregarDados() {
      Papa.parse(URL_PLANILHA_CSV, {
        download: true,
        header: true,
        skipEmptyLines: true,
        complete: function(results) {
          const dados = results.data;
          if (!dados || dados.length === 0) return;

          const colunas = Object.keys(dados[0]);

          renderizarKPIs(dados, colunas);
          renderizarGrafico(dados, colunas);
          renderizarTabela(dados, colunas);

          const agora = new Date();
          document.getElementById('lastUpdate').innerText = `Atualizado às: ${agora.toLocaleTimeString('pt-BR')}`;
        }
      });
    }

    // 1. Gera cartões indicadores (KPIs) para todas as colunas de números
    function renderizarKPIs(dados, colunas) {
      const kpiContainer = document.getElementById('kpiContainer');
      kpiContainer.innerHTML = '';

      // Total de linhas encontradas
      kpiContainer.innerHTML += `
        <div class="kpi-card" style="border-color: #3182ce;">
          <span>Linhas Registradas</span>
          <h2>${dados.length}</h2>
        </div>
      `;

      const cores = ['#38a169', '#805ad5', '#d69e2e', '#e53e3e', '#319795'];
      let corIndex = 0;

      colunas.forEach(col => {
        // Converte texto em número se necessário (aceitando vírgula ou ponto)
        const valores = dados
          .map(item => parseFloat(String(item[col]).replace('.', '').replace(',', '.')))
          .filter(v => !isNaN(v));

        // Se encontrou dados numéricos na coluna, cria um indicador
        if (valores.length > 0) {
          const soma = valores.reduce((a, b) => a + b, 0);
          const media = soma / valores.length;
          const cor = cores[corIndex % cores.length];
          corIndex++;

          kpiContainer.innerHTML += `
            <div class="kpi-card" style="border-color: ${cor};">
              <span>Soma (${col})</span>
              <h2>${soma.toLocaleString('pt-BR', { maximumFractionDigits: 2 })}</h2>
            </div>
          `;
        }
      });
    }

    // 2. Cria o gráfico dinamicamente com base nas colunas
    function renderizarGrafico(dados, colunas) {
      let colunaTexto = colunas[0];
      let colunasNumericas = [];

      colunas.forEach(col => {
        const temNumero = dados.some(item => !isNaN(parseFloat(String(item[col]).replace(',', '.'))));
        if (temNumero) {
          colunasNumericas.push(col);
        } else if (colunaTexto === colunas[0]) {
          colunaTexto = col;
        }
      });

      const labels = dados.map(item => item[colunaTexto] || '');

      const cores = [
        'rgba(54, 162, 235, 0.7)',
        'rgba(255, 99, 132, 0.7)',
        'rgba(75, 192, 192, 0.7)',
        'rgba(255, 206, 86, 0.7)',
        'rgba(153, 102, 255, 0.7)'
      ];

      const datasets = colunasNumericas.map((col, index) => {
        return {
          label: col,
          data: dados.map(item => parseFloat(String(item[col]).replace('.', '').replace(',', '.')) || 0),
          backgroundColor: cores[index % cores.length],
          borderRadius: 4
        };
      });

      const ctx = document.getElementById('autoChart').getContext('2d');
      if (chartInstance) chartInstance.destroy();

      chartInstance = new Chart(ctx, {
        type: 'bar',
        data: { labels: labels, datasets: datasets },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { position: 'top' } },
          scales: { y: { beginAtZero: true } }
        }
      });
    }

    // 3. Monta a tabela em tempo real lendo todas as colunas
    function renderizarTabela(dados, colunas) {
      const header = document.getElementById('tableHeader');
      const body = document.getElementById('tableBody');

      header.innerHTML = colunas.map(col => `<th>${col}</th>`).join('');
      body.innerHTML = dados.map(row => {
        return `<tr>${colunas.map(col => `<td>${row[col] !== undefined ? row[col] : ''}</td>`).join('')}</tr>`;
      }).join('');
    }

    // Executa no carregamento e busca dados novos a cada 15 segundos
    carregarDados();
    setInterval(carregarDados, 15000);
  </script>
</body>
</html>
